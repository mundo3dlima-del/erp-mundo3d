<style>
/* Layout: barra lateral de módulos + área de trabajo; en móvil, módulos como pestañas desplazables arriba */
:root{

  --mp:#6b35b8; --mp-soft:#efe6fb; --n3:#0f7c80; --n3-soft:#dcf2f2;

  color-scheme:light;
}
*{box-sizing:border-box}

main{padding-block:24px 64px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:20px}

.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.pill.ENVIADO{background:var(--warn-soft);color:var(--warn)}

.kpi.link{text-decoration:none;color:inherit}.kpi.link:hover{border-color:var(--accent)}
.kpi.warnk .v{color:var(--warn)}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
.cols.wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:1000px){.cols.wide{grid-template-columns:1fr}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.ph a{font-size:13px;text-decoration:none}
table.dl td{vertical-align:middle}
tr.ghead td{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding-top:14px;background:transparent!important}
.gdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.gdot.bad{background:var(--bad)}.gdot.warn{background:var(--warn)}.gdot.soon{background:var(--blue)}
.dchip{display:inline-block;font:600 11px var(--mono);padding:3px 7px;border-radius:4px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.dchip.bad{background:var(--bad-soft);color:var(--bad)}.dchip.warn{background:var(--warn-soft);color:var(--warn)}.dchip.soon{background:var(--blue-soft);color:var(--blue)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-radius:8px;border-left:3px solid var(--warn);background:var(--warn-soft)}

.alerts .ids{display:flex;gap:4px;flex-wrap:wrap}

.seg.s0,.sw.s0{background:var(--accent)}.seg.s1,.sw.s1{background:var(--blue)}.seg.s2,.sw.s2{background:var(--ok)}.seg.s3,.sw.s3{background:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 4px);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font:600 28px var(--display);box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:5}
.cliblock{display:flex;flex-direction:column;gap:8px}
.cliinfo{font-size:13px;color:var(--fg);padding:0 2px;min-height:0}
.cliinfo.ok{background:var(--ok-soft);padding:8px 10px;border-radius:7px}
.cliinfo.new{background:var(--blue-soft);color:var(--blue);padding:8px 10px;border-radius:7px}
.quick{display:flex;gap:4px;margin-top:4px}
.saldo{grid-column:1/-1;font-size:14px}

.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}

.monthnav{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:15px}

.kpi .v.ok,.okc{color:var(--ok)}.kpi .v.bad{color:var(--bad)}
table.pl td{padding:7px 4px}table.pl td.ind{padding-left:18px;color:var(--muted)}

.bar.wide{grid-template-columns:minmax(90px,170px) 1fr 100px}
.track.dual{height:8px;margin:2px 0;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}.track.dual .fill{background:var(--accent);height:100%}.track.dual .fill.g{background:var(--muted)}

.dd li{padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:13px}

.dd li.ddnew{color:var(--blue);font-weight:600;border-top:1px solid var(--line);margin-top:4px;position:sticky;bottom:-4px;background:var(--surface);justify-content:flex-start;gap:4px}

.selrow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.newcard{border:1px solid var(--blue);background:var(--blue-soft);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.newhead{display:flex;justify-content:space-between;align-items:center;color:var(--blue)}
dialog{overflow:visible}dialog form{max-height:calc(100vh - 40px);overflow:auto}
.pill.mp{background:#efe6fb;color:#6b35b8}

.pill.mp{background:var(--mp-soft);color:var(--mp)}
.btn.mpb{background:var(--mp);border-color:var(--mp);color:#fff}

.eyebrow.mp{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mp)}
.mptoggle{flex-direction:row!important;align-items:center;gap:10px!important;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px!important;color:var(--fg)!important}

/* modo Merchy: mismo ERP, color morado */

/* inicio */
body.home nav.side,body.home .fab,body.home .fabmenu{display:none!important}
body.home .app{grid-template-columns:1fr}

h1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h1{color:var(--gold-ink)}.kpi .v{color:var(--fg)}
.kpi .v.ok{color:var(--ok)}.kpi .v.bad{color:var(--bad)}
.kpi,.panel{border-color:var(--line)}
.eyebrow{color:var(--gold-ink)}
.big .bt{font-weight:800;text-transform:uppercase}
.home h1{color:var(--fg)}
dialog h2{color:var(--gold-ink)}form.isn3 .n3toggle{border-color:var(--n3);background:var(--n3-soft)}
form.ismp h2{color:var(--mp)}
input,select,textarea{background:var(--surface2);color:var(--fg);border-color:var(--line)}
.btn.mpb{color:#fff!important}
.kpi,.panel{background:var(--surface);box-shadow:0 1px 2px rgba(20,20,20,.04)}
.n3toggle input:checked+.sw2{background:var(--n3)}
.n3box{border:1px solid var(--n3);border-radius:8px;padding:10px;background:var(--surface)}
.pill.n3{background:var(--n3-soft);color:var(--n3)}
.big.n3{background:linear-gradient(180deg,#17a2a7,#0b5f63);color:#fff}
/* gráficos */
.viz{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.viz .panel{margin:0}
.viz svg{width:100%;height:auto;display:block}
.viz svg text{fill:var(--muted);font:11px var(--body)}
.viz svg text.vl{fill:var(--fg);font-weight:600}
.viz svg rect.bar:hover{opacity:.8}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:-4px 0 6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) auto;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;overflow:hidden}.hbf{height:100%;background:var(--chart);border-radius:0 4px 4px 0}
.donutw{display:flex;align-items:center;gap:14px}.donutw svg{width:120px;flex:none}
@media (max-width:1100px){.viz{grid-template-columns:1fr 1fr}.viz>:first-child{grid-column:1/-1}}
@media (max-width:760px){.viz{grid-template-columns:1fr}}
.bar .fill,.track.dual .fill{background:var(--gold-grad)}
/* entrada */
.login{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.logincard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.logincard h2{font:800 26px var(--display);text-transform:uppercase;margin:0;color:var(--gold-ink)}
.logincard p{margin:0}
.logincard label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.logincard .btn{padding:11px 14px;font-size:15px}
.loginlogo{border-radius:14px}
nav.side a[data-logout]{margin-top:auto}
@media (max-width:760px){nav.side a[data-logout]{margin-top:0}}

<script>
const STAGES=["RECIBIDO","DISEÑO","IMPRESO","LIJADO","PINTADO","EMBALADO","ENVIADO","POR COBRAR","CAMBIO","COMPLETADO"];
const FUENTES=["INSTAGRAM","WHATSAPP","FACEBOOK"];
const S={pedidos:[],clientes:[],freelance:[],inventario:[],gastos:[],ready:false,error:null};
let db=null;
const RAW={pedidos:[],gastos:[]};
let MODE=(()=>{try{return (m=>["mp","n3d"].includes(m)?m:"m3d")(localStorage.getItem("erp-modo"))}catch(_){return "m3d"}})();
function virtM3D(p){return {...p,_src:p,_virt:"mp",cliente:"Mundo 3D",clienteId:"__m3d__",total:costoDe(p),adelanto:0,segundo:+p.mpCobrado||0,pagos:p.mpPagos||[],fechaSaldo:p.mpFechaCobro||"",fechaAdelanto:"",metodoSaldo:"",status:p.mpStatus||p.status}}
function virtN3D(p){const por=esMPDirecto(p)?"Merchy Prints":"Mundo 3D";return {...p,_src:p,_virt:"n3d",negocio:"n3d",items:undefined,mpVia:undefined,origen3:por,cliente:por,clienteId:"__"+por,pedido:"Diseño · "+(p.pedido||""),total:+p.n3dPago||0,adelanto:0,segundo:+p.n3dCobrado||0,pagos:p.n3dPagos||[],fechaSaldo:p.n3dFechaCobro||"",fechaAdelanto:"",metodoSaldo:"",entrega:p.n3dEntrega||p.entrega,nota:p.n3dNota||"",status:p.n3dStatus||"DISEÑO"}}
const NEG=()=>MODE==="mp"?"merchy":MODE;
const pedidosN3D=()=>[...RAW.pedidos.filter(p=>p.negocio==="n3d"),...RAW.pedidos.filter(p=>p.n3d&&p.negocio!=="n3d").map(virtN3D)];
function proyectar(){
  if(MODE==="mp"){S.pedidos=RAW.pedidos.filter(esMerchy).map(p=>esMPDirecto(p)?p:virtM3D(p));S.gastos=RAW.gastos.filter(g=>g.negocio==="merchy")}
  else if(MODE==="n3d"){S.pedidos=pedidosN3D();S.gastos=RAW.gastos.filter(g=>g.negocio==="n3d")}
  else{S.pedidos=RAW.pedidos.filter(p=>!esMPDirecto(p)&&p.negocio!=="n3d");S.gastos=RAW.gastos.filter(g=>(g.negocio||"m3d")==="m3d")}
}
function setModo(m){if(m===MODE)return;MODE=m;try{localStorage.setItem("erp-modo",m)}catch(_){}views._cli=null;proyectar()}
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const soles=n=>"S/ "+(+n||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const usd=n=>"US$ "+(+n||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const days=(a,b)=>Math.round((new Date(a+"T00:00")-new Date(b+"T00:00"))/864e5);
const fdate=s=>s?new Date(s+"T00:00").toLocaleDateString("es-PE",{day:"numeric",month:"short",year:"2-digit"}):"—";
const saldo=p=>Math.max(0,(+p.total||0)-(+p.adelanto||0)-(+p.segundo||0));
const abierto=p=>p.status!=="COMPLETADO";
const deuda=p=>abierto(p)?saldo(p):0;
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function entregaCell(p){
  if(!p.entrega)return '<span class="muted">—</span>';
  if(!abierto(p))return esc(fdate(p.entrega));
  const d=days(p.entrega,today());
  if(d<0)return `<span class="late">${esc(fdate(p.entrega))} · ${-d}d tarde</span>`;
  if(d<=3)return `<span class="soon">${esc(fdate(p.entrega))} · en ${d}d</span>`;
  return esc(fdate(p.entrega));
}
const pill=s=>`<span class="pill ${esc(String(s).replace(/ /g,"_"))}">${esc(s)}</span>`;

/* ---------- vistas ---------- */
const views={
resumen(){
  const t=today(), act=S.pedidos.filter(abierto);
  const dd=p=>p.entrega?days(p.entrega,t):null;
  const venc=act.filter(p=>p.entrega&&dd(p)<0).sort((a,b)=>a.entrega.localeCompare(b.entrega));
  const hoy=act.filter(p=>p.entrega&&dd(p)>=0&&dd(p)<=1);
  const semana=act.filter(p=>p.entrega&&dd(p)>=2&&dd(p)<=7);
  const quince=act.filter(p=>p.entrega&&dd(p)>=8&&dd(p)<=14);
  const sinFecha=act.filter(p=>!p.entrega);
  const porCobrar=act.reduce((a,p)=>a+deuda(p),0);
  const mk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  const now=new Date(), mes=mk(now), mesAnt=mk(new Date(now.getFullYear(),now.getMonth()-1,1));
  const ventas=m=>S.pedidos.filter(p=>(p.creado||"").startsWith(m)).reduce((a,p)=>a+(+p.total||0),0);
  const gastos=m=>S.gastos.filter(g=>(g.fecha||"").startsWith(m)).reduce((a,g)=>a+(+g.monto||0),0);
  const vM=ventas(mes), vA=ventas(mesAnt);
  const diaMes=now.getDate(), diasMes=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const proy=diaMes?vM/diaMes*diasMes:0;
  const n90=S.pedidos.filter(p=>p.creado&&days(t,p.creado)<=90&&+p.total>0);
  const _s=n90.map(p=>+p.total).sort((a,b)=>a-b);const ticket=_s.length?(_s.length%2?_s[(_s.length-1)/2]:(_s[_s.length/2-1]+_s[_s.length/2])/2):0;
  const bajo=S.inventario.filter(i=>(+i.stock||0)<=(+i.minimo||0));
  const pct=(a,b)=>b?Math.round((a-b)/b*100):null;
  const ch=pct(vM,vA);
  // ventas 12 meses
  const ms=[];for(let i=11;i>=0;i--)ms.push(mk(new Date(now.getFullYear(),now.getMonth()-i,1)));
  const vm=ms.map(m=>({m,v:ventas(m),n:S.pedidos.filter(p=>(p.creado||"").startsWith(m)).length,g:gastos(m)}));
  const mx=Math.max(1,...vm.map(x=>Math.max(x.v,x.g)));
  const W=640,H=200,pl=8,pb=22,bw=(W-pl*2)/12;
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ventas por mes, últimos 12 meses" style="display:block">
    ${[0.25,.5,.75,1].map(f=>`<line x1="0" x2="${W}" y1="${(H-pb)-(H-pb-14)*f}" y2="${(H-pb)-(H-pb-14)*f}" style="stroke:var(--line)" stroke-width="1"/>`).join("")}
    ${vm.map((x,i)=>{const h=(H-pb-14)*x.v/mx, y=H-pb-h, X=pl+i*bw+bw*.18, w=bw*.64, cur=x.m===mes;
      const gh=(H-pb-14)*x.g/mx;
      return `<g><title>${esc(x.m)}: ${esc(soles(x.v))} en ${x.n} pedidos${x.g?" · gastos "+esc(soles(x.g)):""}</title>
      <rect x="${X}" y="${y}" width="${w}" height="${Math.max(h,0)}" rx="3" fill="${cur?"var(--accent)":"var(--accent-soft)"}" ${cur?"":'style="stroke:var(--accent)" stroke-width="1"'}/>
      ${x.g?`<rect x="${X+w*.3}" y="${H-pb-gh}" width="${w*.4}" height="${gh}" style="fill:var(--muted)" opacity=".7"/>`:""}
      <text x="${X+w/2}" y="${H-6}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(new Date(x.m+"-01T00:00").toLocaleDateString("es-PE",{month:"short"}).replace(".",""))}</text>
      ${cur||x.v===Math.max(...vm.map(z=>z.v))?`<text x="${X+w/2}" y="${y-4}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--fg)">${esc(Math.round(x.v/1000*10)/10)}k</text>`:""}</g>`}).join("")}
  </svg>`;
  // producción por etapa
  const stg=STAGES.filter(s=>s!=="COMPLETADO").map(s=>({s,ps:act.filter(p=>p.status===s)})).filter(x=>x.ps.length);
  const stMax=Math.max(1,...stg.map(x=>x.ps.length));
  // deudores
  const deud=act.filter(p=>deuda(p)>0).sort((a,b)=>deuda(b)-deuda(a)).slice(0,6);
  // canales 90 días
  const can={};n90.forEach(p=>{const k=p.fuente||"SIN CANAL";const c=can[k]||(can[k]={n:0,v:0});c.n++;c.v+=+p.total});
  const canTot=Object.values(can).reduce((a,c)=>a+c.v,0)||1;
  // top clientes 12 meses
  const cl={};S.pedidos.filter(p=>p.creado&&days(t,p.creado)<=365).forEach(p=>{const k=(p.cliente||"").trim();if(!k)return;const kk=p.clienteId||normKey(k);const c=cl[kk]||(cl[kk]={k:p.clienteId||k,name:k,v:0,n:0});c.v+=+p.total||0;c.n++});
  const topCl=Object.values(cl).sort((a,b)=>b.v-a.v).slice(0,5);
  // alertas
  const alertas=[];
  const viejos=venc.filter(p=>dd(p)<-30);
  if(viejos.length)alertas.push(["bad",`${viejos.length} pedido(s) vencidos hace más de 30 días siguen abiertos. Revisa si ya se entregaron y actualiza la etapa.`,viejos]);
  const atrRec=venc.filter(p=>p.status==="RECIBIDO");
  if(atrRec.length)alertas.push(["bad",`${atrRec.length} pedido(s) vencidos que todavía no pasan de RECIBIDO.`,atrRec]);
  const sinMonto=act.filter(p=>!+p.total);
  if(sinMonto.length)alertas.push(["warn",`${sinMonto.length} pedido(s) en curso sin monto total.`,sinMonto]);
  if(sinFecha.length)alertas.push(["warn",`${sinFecha.length} pedido(s) en curso sin fecha de entrega.`,sinFecha]);
  const sinAdel=act.filter(p=>+p.total>0&&!+p.adelanto);
  if(sinAdel.length)alertas.push(["warn",`${sinAdel.length} pedido(s) sin adelanto registrado.`,sinAdel]);
  if(bajo.length)alertas.push(["warn",`${bajo.length} material(es) por debajo del mínimo: ${bajo.map(i=>i.nombre).join(", ")}.`,[]]);
  const row=p=>{const d=dd(p);const lbl=d==null?"sin fecha":d<0?`${-d} d tarde`:d===0?"hoy":d===1?"mañana":`en ${d} d`;
    return `<tr class="click" data-edit="${esc(p.id)}"><td><span class="dchip ${d==null?"":d<0?"bad":d<=1?"warn":d<=7?"soon":""}">${esc(lbl)}</span></td><td><b>#${p.num}</b> ${esc(p.pedido||"(sin descripción)")}<div class="muted" style="font-size:12px">${esc(p.cliente)} · ${esc(fdate(p.entrega))}</div></td><td>${pill(p.status)}</td><td class="r">${deuda(p)?soles(deuda(p)):'<span class="muted">—</span>'}</td></tr>`};
  const grp=(titulo,arr,cls)=>(arr=arr.slice().sort((a,b)=>(a.entrega||"").localeCompare(b.entrega||"")),arr.length)?`<tr class="ghead"><td colspan="4"><span class="gdot ${cls}"></span>${esc(titulo)} <span class="muted">· ${arr.length}</span></td></tr>${arr.map(row).join("")}`:"";
  const proximos=[...hoy,...semana,...quince].sort((a,b)=>a.entrega.localeCompare(b.entrega));
  return `
  <div class="top"><div><h1>Dashboard Mundo 3D</h1><div class="muted">${esc(now.toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}))} · se actualiza con cada cambio</div></div>
  <button class="btn primary" data-act="nuevo">+ Nuevo pedido</button></div>
  <div class="kpis">
    <a class="kpi link" href="#pedidos"><div class="l">Pedidos en curso</div><div class="v">${act.length}</div><div class="s">${act.filter(p=>p.status!=="RECIBIDO").length} ya en producción</div></a>
    <div class="kpi ${venc.length?"alert":""}"><div class="l">Vencidos</div><div class="v">${venc.length}</div><div class="s">entrega ya pasó</div></div>
    <div class="kpi ${hoy.length+semana.length?"warnk":""}"><div class="l">Vencen en 7 días</div><div class="v">${hoy.length+semana.length}</div><div class="s">${hoy.length} hoy o mañana</div></div>
    <a class="kpi link" href="#cobros"><div class="l">Por cobrar</div><div class="v">${soles(porCobrar)}</div><div class="s">${act.filter(p=>deuda(p)>0).length} pedidos con saldo</div></a>
    <div class="kpi"><div class="l">Ventas de ${esc(now.toLocaleDateString("es-PE",{month:"long"}))}</div><div class="v">${soles(vM)}</div><div class="s">${ch==null?"sin datos del mes anterior":`<span class="${ch>=0?"up":"down"}">${ch>=0?"▲":"▼"} ${Math.abs(ch)}%</span> vs mes anterior`} · proyección ${soles(proy)}</div></div>
    <div class="kpi"><div class="l">Pedido típico</div><div class="v">${soles(ticket)}</div><div class="s">mediana, últimos 90 días · ${n90.length} pedidos</div></div>
  </div>
  ${visuales()}
  ${alertas.length?`<div class="panel"><h2>Para revisar</h2><ul class="alerts">${alertas.map(([c,txt,arr])=>`<li class="${c}"><span>${esc(txt)}</span>${arr.length?`<span class="ids">${arr.slice(0,8).map(p=>`<button class="btn sm" data-edit="${esc(p.id)}">#${p.num}</button>`).join("")}</span>`:""}</li>`).join("")}</ul></div>`:""}

  <div class="cols wide">
    <div class="panel"><div class="ph"><h2>Entregas</h2><a href="#produccion" class="muted">Ver producción →</a></div>
      ${venc.length+proximos.length+sinFecha.length?`<div class="tbl"><table class="dl"><tbody>
        ${grp("Vencidos",venc,"bad")}${grp("Hoy y mañana",hoy,"warn")}${grp("Esta semana",semana,"soon")}${grp("Próxima semana",quince,"")}${grp("Sin fecha",sinFecha,"")}
      </tbody></table></div>`:`<div class="empty">No hay entregas pendientes en las próximas dos semanas.</div>`}
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="panel"><h2>Producción en curso</h2>
        ${stg.length?`<div class="bars">${stg.map(x=>`<div class="bar"><span>${esc(x.s)}</span><div class="track"><div class="fill" style="width:${x.ps.length/stMax*100}%"></div></div><span style="text-align:right">${x.ps.length}</span></div>`).join("")}</div>`:`<div class="empty">Sin pedidos en producción.</div>`}
      </div>
      <div class="panel"><div class="ph"><h2>Mayores saldos</h2><a href="#cobros" class="muted">Cobros →</a></div>
        ${deud.length?`<div class="tbl"><table><tbody>${deud.map(p=>`<tr class="click" data-pago="${esc(p.id)}"><td><b>${esc(p.cliente)}</b><div class="muted" style="font-size:12px">#${p.num} ${esc(p.pedido)}</div></td><td>${pill(p.status)}</td><td class="r"><b>${soles(deuda(p))}</b><div class="muted" style="font-size:12px;white-space:nowrap">de ${soles(p.total)}</div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nadie te debe.</div>`}
      </div>
    </div>
  </div>

  <div class="cols">
    <div class="panel"><h2>Ventas por mes</h2>${svg}
      <div class="muted" style="font-size:12px">Monto total de los pedidos registrados cada mes${S.gastos.length?"; barra gris: gastos":""}. Pasa el cursor sobre una barra para ver el detalle.</div></div>
    <div class="panel"><h2>Canales · últimos 90 días</h2>
      ${Object.keys(can).length?`<div class="stack">${Object.entries(can).sort((a,b)=>b[1].v-a[1].v).map(([k,c],i)=>`<div class="seg s${i}" style="width:${c.v/canTot*100}%" title="${esc(k)}"></div>`).join("")}</div>

const costoProvDe=p=>esMerchy(p)?(p.costoProvTotal!=null?+p.costoProvTotal||0:itemsDe(p).reduce((a,l)=>a+(+l.cantidad||0)*(+l.costoProv||0),0)):0;

const normKey=n=>String(n||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const median=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):0};
function pedidosDe(c){const k=normKey(c.nombre);return S.pedidos.filter(p=>p.clienteId?p.clienteId===c.id:normKey(p.cliente)===k)}
function statsCliente(c){
  const ps=pedidosDe(c).sort((a,b)=>(a.creado||"").localeCompare(b.creado||""));
  const tot=ps.filter(p=>+p.total>0).map(p=>+p.total);
  const fechas=ps.map(p=>p.creado).filter(Boolean);
  const gaps=[];for(let i=1;i<fechas.length;i++)gaps.push(days(fechas[i],fechas[i-1]));
  return {ps,n:ps.length,total:tot.reduce((a,b)=>a+b,0),tipico:median(tot),deuda:ps.reduce((a,p)=>a+deuda(p),0),
    primera:fechas[0]||"",ultima:fechas[fechas.length-1]||"",frecuencia:gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):null};
}

function nuevoIdCliente(nombre){let base="c_"+(normKey(nombre).slice(0,40)||"cliente"),id=base,i=2;while(S.clientes.some(c=>c.id===id))id=base+"_"+i++;return id}
async function migrarClientes(btn){
  btn.disabled=true;
  const grupos={};S.pedidos.filter(p=>!p.clienteId).sort((a,b)=>(a.creado||"").localeCompare(b.creado||"")).forEach(p=>{const k=normKey(p.cliente)||"sinnombre";(grupos[k]=grupos[k]||[]).push(p)});
  const tareas=[];
  for(const [k,ps] of Object.entries(grupos)){
    let c=S.clientes.find(x=>normKey(x.nombre)===k);
    let id=c&&c.id;
    if(!c){const n=(ps[0].cliente||"").trim()||"(sin nombre)";id=nuevoIdCliente(n);const dig=n.replace(/\D/g,"");
      const data={nombre:n,telefono:dig.length>=9&&dig.length===n.replace(/[\s+]/g,"").length?dig:"",instagram:"",email:"",distrito:"",direccion:"",notas:"",canal:(ps.filter(p=>p.fuente).pop()||{}).fuente||"",creado:ps[0].creado||today()};

  let hechas=0;

function matchCliente(q){
  if(!q)return null;
  const name=q.split(" · ")[0].trim(),k=normKey(name),dig=q.replace(/\D/g,"");
  return S.clientes.find(c=>normKey(c.nombre)===k)||(dig.length>=9?S.clientes.find(c=>c.telefono&&c.telefono.slice(-9)===dig.slice(-9)):null)||S.clientes.find(c=>c.instagram&&normKey(c.instagram)===normKey(q.replace(/^@/,"")))||null;
}

function movimientos(){
  const out=[];
  S.pedidos.forEach(p=>{
    if(+p.adelanto>0)out.push({fecha:p.fechaAdelanto||p.creado||"",monto:+p.adelanto,tipo:"Adelanto",p});
    const pg=Array.isArray(p.pagos)?p.pagos:[];const enPagos=pg.reduce((a,x)=>a+(+x.monto||0),0);
    pg.forEach(x=>out.push({fecha:x.fecha,monto:+x.monto,tipo:"Saldo",metodo:x.metodo,p}));
    const resto=(+p.segundo||0)-enPagos;
    if(resto>0.005)out.push({fecha:p.fechaSaldo||p.entrega||p.creado||"",monto:resto,tipo:"Saldo",p});
    if(p.status==="COMPLETADO"&&saldo(p)>0.005)out.push({fecha:p.fechaSaldo||p.entrega||p.creado||"",monto:saldo(p),tipo:"Saldo",est:true,p});
  });
  return out;
}
function resumenMes(m){
  const ing=movimientos().filter(x=>(x.fecha||"").startsWith(m));
  const gas=S.gastos.filter(g=>(g.fecha||"").startsWith(m));
  const cobrado=ing.reduce((a,x)=>a+x.monto,0),estimado=ing.filter(x=>x.est).reduce((a,x)=>a+x.monto,0);
  const gastos=gas.reduce((a,g)=>a+(+g.monto||0),0);
  const ventas=S.pedidos.filter(p=>(p.creado||"").startsWith(m));
  return {ing,gas,cobrado,estimado,gastos,res:cobrado-gastos,ventas,vendido:ventas.reduce((a,p)=>a+(+p.total||0),0),
    entregados:S.pedidos.filter(p=>p.status==="COMPLETADO"&&((p.fechaSaldo||p.entrega||"").startsWith(m))).length};
}

}

document.addEventListener("keydown",e=>{if(e.key==="n"&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!$("#dlg").open&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&db){e.preventDefault();pedidoForm(null,null,MODE==="mp")}});
document.addEventListener("input",e=>{
  if(e.target.id==="pq"){views._pf.q=e.target.value;render()}
  if(e.target.id==="cq"){views._co.q=e.target.value;render()}
});
document.addEventListener("change",e=>{if(e.target.id==="pst"){views._pf.st=e.target.value;render()}if(e.target.id==="pneg"){views._pf.neg=e.target.value;render()}if(e.target.id==="csort"){views._co.sort=e.target.value;render()}});
document.addEventListener("click",async e=>{
  if(!e.target.closest("#fabmenu,.fab"))$("#fabmenu").hidden=true;
  const t=e.target.closest("[data-mm],[data-bm],[data-act],[data-editcli],[data-nuevopara],[data-edit],[data-mv],[data-pago],[data-inv],[data-stk],[data-gasto],[data-free],[data-cli]");if(!t||!db)return;
  const byId=(arr,id)=>arr.find(x=>x.id===id);
  try{
  if(t.dataset.bm){views._bm=t.dataset.bm;render();return}
  if(t.dataset.mm){views._mm=t.dataset.mm;render();return}
  if(t.dataset.act!=="fab")$("#fabmenu").hidden=true;
  if(t.dataset.act==="fab"){const m=$("#fabmenu");m.hidden=!m.hidden;t.setAttribute("aria-expanded",String(!m.hidden))}
  else if(t.dataset.act==="cobrar")pagoForm();
  else if(t.dataset.act==="nuevo")pedidoForm(null,null,MODE==="mp");
  else if(t.dataset.act==="nuevomerchy")pedidoForm(null,null,true);
  else if(t.dataset.act==="gastomerchy")gastoForm(null,"merchy");
  else if(t.dataset.act==="cliente")clienteForm(null,id=>{views._cli=id;location.hash="clientes";render()});
  else if(t.dataset.act==="volver"){views._cli=null;render()}
  else if(t.dataset.act==="migrar")await migrarClientes(t);
  else if(t.dataset.editcli)clienteForm(byId(S.clientes,t.dataset.editcli));
  else if(t.dataset.nuevopara)pedidoForm(null,t.dataset.nuevopara);
  else if(t.dataset.act==="inv")invForm();
  else if(t.dataset.act==="gasto")gastoForm();
  else if(t.dataset.act==="free")freeForm();
  else if(t.dataset.edit)pedidoForm(byId(S.pedidos,t.dataset.edit));
  else if(t.dataset.pago)pagoForm(byId(S.pedidos,t.dataset.pago));
  else if(t.dataset.inv)invForm(byId(S.inventario,t.dataset.inv));
  else if(t.dataset.gasto)gastoForm(byId(S.gastos,t.dataset.gasto));
  else if(t.dataset.free)freeForm(byId(S.freelance,t.dataset.free));
  else if(t.dataset.cli)abrirCliente(t.dataset.cli);
  else if(t.dataset.mv){const p=byId(S.pedidos,t.dataset.id);const i=Math.min(STAGES.length-1,Math.max(0,STAGES.indexOf(p.status)+ +t.dataset.mv));t.disabled=true;
    await db.collection("pedidos").doc(p.id).update(p._virt?{[p._virt+"Status"]:STAGES[i]}:{status:STAGES[i]});toast(`#${p.num} → ${STAGES[i]}`)}
  else if(t.dataset.stk){const it=byId(S.inventario,t.dataset.id);t.disabled=true;await db.collection("inventario").doc(it.id).update({stock:Math.max(0,(+it.stock||0)+ +t.dataset.stk)})}
  }catch(err){toast("No se pudo guardar: "+(err.message||err.code||"error"));render()}
});

document.addEventListener("click",e=>{if(e.target.closest("[data-logout]")){e.preventDefault();SheetDB.logout()}});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{
  render();
  db=await SheetDB.connect();
  const timer=setTimeout(()=>{if(!S.ready){S.error="Los datos tardan en cargar. Revisa tu conexión y vuelve a abrir la página.";render()}},20000);
  let pend=new Set(["pedidos","clientes","freelance","inventario","gastos"]);
  for(const c of pend){
    db.collection(c).onSnapshot(snap=>{const rows=snap.docs.map(d=>({id:d.id,...d.data()}));if(c in RAW){RAW[c]=rows;proyectar()}else S[c]=rows;pend.delete(c);if(!pend.size){S.ready=true;clearTimeout(timer)}render()},
      err=>{clearTimeout(timer);S.error=err.code==="unauthenticated"?"La clave cambió. Cierra sesión y vuelve a entrar.":(err.message||"No se pudieron cargar los datos ("+err.code+").");render()});
  }
})();
</script>

</body></html>
